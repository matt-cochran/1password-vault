services:
  serve:
    image: journeeze:local
    command: ["serve"]
    user: "${OPV_UID:?run this under opv run}:${OPV_GID:?run this under opv run}"
    environment:
      JZ_VAULT_DIR: /run/secrets/journeeze
    volumes:
      - type: bind
        source: "${OPV_SECRETS_DIR:?run this under opv run}"
        target: /run/secrets/journeeze
        read_only: true
    logging:
      driver: none
