name: CI
'on':
  workflow_call: null
permissions:
  contents: read
jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os == 'ubuntu-latest' && vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404'
      || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        - windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      with:
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
    - name: Install shells for the syntax tests
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh fish
    - name: Check formatting
      run: cargo fmt --all --check
    - name: Run clippy
      run: cargo clippy --all-targets --features fake,mcp -- -D warnings
    - name: Run tests
      run: cargo test --locked --features fake,mcp
      env:
        OPV_REQUIRE_SHELLS: ${{ runner.os == 'Linux' && '1' || '' }}
  mcp-protocol:
    name: MCP stdio protocol
    runs-on: ${{ vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
    - name: Build optional MCP server
      run: cargo build --locked --bin opv
    - name: Exercise protocol without credentials
      run: python3 tests/mcp_protocol.py target/debug/opv
  deny:
    name: cargo-deny
    runs-on: ${{ vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
      with:
        command: check advisories licenses bans sources
  install-script:
    name: Install script (${{ matrix.os }})
    runs-on: ${{ matrix.os == 'ubuntu-latest' && vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404'
      || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: shellcheck install.sh
      if: runner.os == 'Linux'
      run: shellcheck install.sh
    - name: Test install.sh
      run: bash tests/install/test_install.sh
    - name: Test npm install/uninstall scripts
      run: node --test 'packaging/npm/**/*.test.js'
  readiness-hook:
    name: Claude readiness hook
    runs-on: ${{ vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Test opt-in adapter with fake opv
      run: python3 -m unittest discover -s examples/claude-readiness-hook -p 'test_*.py' -v
  release-policy:
    name: Release artifact trust
    runs-on: ${{ vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
    - run: node --test tests/release-assets.test.ts
