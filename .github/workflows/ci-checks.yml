name: CI
'on':
  workflow_call: null
permissions:
  contents: read
jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os == 'ubuntu-latest' && vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404'
      || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        - windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
      with:
        toolchain: 1.100.0
        components: rustfmt, clippy
    - name: Require the pinned Rust (rust-toolchain.toml)
      shell: bash
      run: |
        v=$(rustc --version)
        echo "$v"
        case "$v" in "rustc 1.100.0 "*) ;; *) echo "::error::expected rustc 1.100.0 from rust-toolchain.toml, got: $v"; exit 1;; esac
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
    - name: Install shells for the syntax tests
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        . /etc/os-release
        case "${VERSION_CODENAME:-}" in
          jammy|noble|resolute) ;;
          *) echo 'Unsupported Ubuntu suite for shell dependencies' >&2; exit 1 ;;
        esac
        ci_apt_arch=$(dpkg --print-architecture)
        [[ "$ci_apt_arch" =~ ^[a-z0-9][a-z0-9-]*$ ]]
        test -r /usr/share/keyrings/ubuntu-archive-keyring.gpg
        ci_apt_dir=$(mktemp -d)
        trap 'sudo rm -rf -- "$ci_apt_dir"' EXIT
        chmod 0755 "$ci_apt_dir"
        mkdir "$ci_apt_dir/lists" "$ci_apt_dir/sourceparts"
        # Mirror reachability and Ubuntu signatures observed in run 43057961543. Three HTTPS
        # mirrors, tried in order: kernel.org alone was unreachable from runners on 2026-11-17.
        # Preserve Ubuntu Signed-By and apt's normal TLS/signature/time checks.
        # Observed InRelease files omit Valid-Until: a valid signature is not
        # proof of a signed expiry or mirror freshness. Do not override checks.
        cat > "$ci_apt_dir/ubuntu.sources" <<EOF
        Types: deb
        URIs: https://azure.archive.ubuntu.com/ubuntu/ https://archive.ubuntu.com/ubuntu/ https://mirrors.edge.kernel.org/ubuntu/
        Suites: $VERSION_CODENAME $VERSION_CODENAME-updates $VERSION_CODENAME-security $VERSION_CODENAME-backports
        Components: main restricted universe multiverse
        Architectures: $ci_apt_arch
        Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
        EOF
        ci_apt_options=(
          -o "Dir::Etc::sourcelist=$ci_apt_dir/ubuntu.sources"
          -o "Dir::Etc::sourceparts=$ci_apt_dir/sourceparts"
          -o "Dir::State::lists=$ci_apt_dir/lists"
        )
        sudo apt-get "${ci_apt_options[@]}" update
        sudo apt-get "${ci_apt_options[@]}" install -y --no-install-recommends zsh fish
    - name: Check formatting
      run: cargo fmt --all --check
    - name: Run clippy
      run: cargo clippy --all-targets --features fake,mcp -- -D warnings
    - name: Run tests
      run: cargo test --locked --features fake,mcp
      env:
        OPV_REQUIRE_SHELLS: ${{ runner.os == 'Linux' && '1' || '' }}
  mcp-protocol:
    name: MCP stdio protocol
    runs-on: ${{ vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
      with:
        toolchain: 1.100.0
    - name: Build optional MCP server
      run: cargo build --locked --bin opv
    - name: Exercise protocol without credentials
      run: python3 tests/mcp_protocol.py target/debug/opv
  github-secret-api:
    name: GitHub secret byte preservation
    runs-on: ${{ vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: actions/create-github-app-token
        ref: bcd2ba49218906704ab6c1aa796996da409d3eb1
        path: consumer-fixture
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
    - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
      with:
        toolchain: 1.100.0
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
    - name: Prepare credential-free test dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends python3-cryptography libsodium23
        npm ci --prefix consumer-fixture --omit=dev --ignore-scripts --no-audit --no-fund
    - name: Build test-only backend harness
      run: cargo build --locked --features fake --bin opv-github-api-fixture
    - name: Verify actual HTTPS ciphertext and pinned action consumer offline
      run: /usr/bin/python3 tests/github_api_tls.py target/debug/opv-github-api-fixture consumer-fixture
  deny:
    name: cargo-deny
    runs-on: ${{ vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
      with:
        command: check advisories licenses bans sources
  install-script:
    name: Install script (${{ matrix.os }})
    runs-on: ${{ matrix.os == 'ubuntu-latest' && vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404'
      || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: shellcheck install.sh
      if: runner.os == 'Linux'
      run: shellcheck install.sh
    - name: Test install.sh
      run: bash tests/install/test_install.sh
    - name: Test npm install/uninstall scripts
      run: node --test 'packaging/npm/**/*.test.js'
  readiness-hook:
    name: Claude readiness hook
    runs-on: ${{ vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Test opt-in adapter with fake opv
      run: python3 -m unittest discover -s examples/claude-readiness-hook -p 'test_*.py' -v
  release-policy:
    name: Release artifact trust
    runs-on: ${{ vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
    - run: node --test 'tests/*.test.ts'
  # The agent identity's OS credential store against each platform's real store (#338,
  # design agent-identity §4.4, spike S1). tests/credential_store_live.rs only ever stores a
  # fixed dummy and deletes it; it is a no-op without OPV_LIVE_STORE_TEST=1.
  credential-store-linux:
    name: Credential store (Secret Service, kernel keyring)
    runs-on: ${{ vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
      with:
        toolchain: 1.100.0
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
    - name: Install a headless Secret Service
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends dbus gnome-keyring keyutils
    - name: Build the live store test
      shell: bash
      run: |
        set -euo pipefail
        exe=$(cargo test --locked --test credential_store_live --no-run --message-format=json \
          | jq -r 'select(.profile.test == true and .target.name == "credential_store_live") | .executable')
        test -x "$exe"
        mkdir -p live
        cp "$exe" live/credential_store_live
    - name: Kernel keyring fallback, no session bus
      # Advisory: a CI job's (or systemd service's) session keyring does not link the user
      # keyring @u, so the write is refused there (agent_store_unavailable, never a file).
      # Logins (pam_keyinit) link it; the next step proves that case.
      continue-on-error: true
      shell: bash
      run: |
        keyctl show @s || true
        keyctl show @u || true
        env -u DBUS_SESSION_BUS_ADDRESS -u XDG_RUNTIME_DIR OPV_LIVE_STORE_TEST=1 OPV_LIVE_STORE_EXPECT=kernel_keyring live/credential_store_live
    - name: Kernel keyring fallback inside a login-like session (@u linked into @s)
      shell: bash
      run: |
        keyctl session - bash -c 'keyctl link @u @s && env -u DBUS_SESSION_BUS_ADDRESS -u XDG_RUNTIME_DIR OPV_LIVE_STORE_TEST=1 OPV_LIVE_STORE_EXPECT=kernel_keyring live/credential_store_live'
    - name: Secret Service, unlocked with a dummy keyring password
      shell: bash
      run: |
        dbus-run-session -- sh -c '
          printf "%s" ci-dummy-keyring-password | gnome-keyring-daemon --unlock --components=secrets >/dev/null
          OPV_LIVE_STORE_TEST=1 OPV_LIVE_STORE_EXPECT=secret_service live/credential_store_live'
    - name: Secret Service, locked collection fails as agent_store_locked within 5 s
      shell: bash
      run: |
        # The login keyring from the step above, in a new session whose daemon was never
        # unlocked: the collection exists and is locked, as at a WSL VM start.
        test -f "$HOME/.local/share/keyrings/login.keyring"
        dbus-run-session -- sh -c '
          gnome-keyring-daemon --start --components=secrets >/dev/null
          OPV_LIVE_STORE_TEST=1 OPV_LIVE_STORE_LOCKED=1 timeout 30 live/credential_store_live'
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: credential-store-live-linux
        path: live/credential_store_live
        retention-days: 1
  credential-store-native:
    name: Credential store (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          store: macos_keychain
        - os: windows-latest
          store: windows_credential_manager
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
      with:
        toolchain: 1.100.0
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
    - name: Round-trip the dummy through the platform store
      run: cargo test --locked --test credential_store_live
      env:
        OPV_LIVE_STORE_TEST: '1'
        OPV_LIVE_STORE_EXPECT: ${{ matrix.store }}
  credential-store-wsl:
    name: Credential store (WSL interop to Credential Manager)
    needs: credential-store-linux
    runs-on: windows-latest
    steps:
    # WSL 1: hosted Windows runners have no nested virtualization for WSL 2. The interop
    # path (powershell.exe from Linux, value on stdin) is the same in both.
    - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
      with:
        distribution: Ubuntu-24.04
        wsl-version: 1
        use-cache: 'true'
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: credential-store-live-linux
    - name: Round-trip the dummy through Credential Manager from WSL
      shell: wsl-bash {0}
      run: |
        set -eu
        chmod +x ./credential_store_live
        # Warm up interop: a fresh runner's first powershell.exe from WSL can take longer than
        # opv's 15 s store bound, which the test would report as agent_store_locked.
        for i in 1 2; do (cd /mnt/c && timeout 120 powershell.exe -NoProfile -NonInteractive -Command '[void][Windows.Security.Credentials.PasswordVault,Windows.Security.Credentials,ContentType=WindowsRuntime]; "warm"') || true; done
        OPV_LIVE_STORE_TEST=1 OPV_LIVE_STORE_EXPECT=windows_credential_manager ./credential_store_live
