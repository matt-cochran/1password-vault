name: CI
'on':
  workflow_call: null
permissions:
  contents: read
jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os == 'ubuntu-latest' && vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404'
      || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        - windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      with:
        toolchain: 1.99.1
        components: rustfmt, clippy
    - name: Require the pinned Rust (rust-toolchain.toml)
      shell: bash
      run: |
        v=$(rustc --version)
        echo "$v"
        case "$v" in "rustc 1.99.1 "*) ;; *) echo "::error::expected rustc 1.99.1 from rust-toolchain.toml, got: $v"; exit 1;; esac
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
    - name: Install shells for the syntax tests
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        . /etc/os-release
        case "${VERSION_CODENAME:-}" in
          jammy|noble|resolute) ;;
          *) echo 'Unsupported Ubuntu suite for shell dependencies' >&2; exit 1 ;;
        esac
        ci_apt_arch=$(dpkg --print-architecture)
        [[ "$ci_apt_arch" =~ ^[a-z0-9][a-z0-9-]*$ ]]
        test -r /usr/share/keyrings/ubuntu-archive-keyring.gpg
        ci_apt_dir=$(mktemp -d)
        trap 'sudo rm -rf -- "$ci_apt_dir"' EXIT
        chmod 0755 "$ci_apt_dir"
        mkdir "$ci_apt_dir/lists" "$ci_apt_dir/sourceparts"
        # Mirror reachability and Ubuntu signatures observed in run 43057961543.
        # Preserve Ubuntu Signed-By and apt's normal TLS/signature/time checks.
        # Observed InRelease files omit Valid-Until: a valid signature is not
        # proof of a signed expiry or mirror freshness. Do not override checks.
        cat > "$ci_apt_dir/ubuntu.sources" <<EOF
        Types: deb
        URIs: https://mirrors.edge.kernel.org/ubuntu/
        Suites: $VERSION_CODENAME $VERSION_CODENAME-updates $VERSION_CODENAME-security $VERSION_CODENAME-backports
        Components: main restricted universe multiverse
        Architectures: $ci_apt_arch
        Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
        EOF
        ci_apt_options=(
          -o "Dir::Etc::sourcelist=$ci_apt_dir/ubuntu.sources"
          -o "Dir::Etc::sourceparts=$ci_apt_dir/sourceparts"
          -o "Dir::State::lists=$ci_apt_dir/lists"
        )
        sudo apt-get "${ci_apt_options[@]}" update
        sudo apt-get "${ci_apt_options[@]}" install -y --no-install-recommends zsh fish
    - name: Check formatting
      run: cargo fmt --all --check
    - name: Run clippy
      run: cargo clippy --all-targets --features fake,mcp -- -D warnings
    - name: Run tests
      run: cargo test --locked --features fake,mcp
      env:
        OPV_REQUIRE_SHELLS: ${{ runner.os == 'Linux' && '1' || '' }}
  mcp-protocol:
    name: MCP stdio protocol
    runs-on: ${{ vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      with:
        toolchain: 1.99.1
    - name: Build optional MCP server
      run: cargo build --locked --bin opv
    - name: Exercise protocol without credentials
      run: python3 tests/mcp_protocol.py target/debug/opv
  github-secret-api:
    name: GitHub secret byte preservation
    runs-on: ${{ vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: actions/create-github-app-token
        ref: bcd2ba49218906704ab6c1aa796996da409d3eb1
        path: consumer-fixture
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
    - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      with:
        toolchain: 1.99.1
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
    - name: Prepare credential-free test dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends python3-cryptography libsodium23
        npm ci --prefix consumer-fixture --omit=dev --ignore-scripts --no-audit --no-fund
    - name: Build test-only backend harness
      run: cargo build --locked --features fake --bin opv-github-api-fixture
    - name: Verify actual HTTPS ciphertext and pinned action consumer offline
      run: /usr/bin/python3 tests/github_api_tls.py target/debug/opv-github-api-fixture consumer-fixture
  deny:
    name: cargo-deny
    runs-on: ${{ vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
      with:
        command: check advisories licenses bans sources
  install-script:
    name: Install script (${{ matrix.os }})
    runs-on: ${{ matrix.os == 'ubuntu-latest' && vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404'
      || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: shellcheck install.sh
      if: runner.os == 'Linux'
      run: shellcheck install.sh
    - name: Test install.sh
      run: bash tests/install/test_install.sh
    - name: Test npm install/uninstall scripts
      run: node --test 'packaging/npm/**/*.test.js'
  readiness-hook:
    name: Claude readiness hook
    runs-on: ${{ vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Test opt-in adapter with fake opv
      run: python3 -m unittest discover -s examples/claude-readiness-hook -p 'test_*.py' -v
  release-policy:
    name: Release artifact trust
    runs-on: ${{ vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
    - run: node --test 'tests/*.test.ts'
