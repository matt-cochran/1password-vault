name: Release
'on':
  push:
    tags:
    - v*
    branches:
    - staging
    - main
  pull_request:
    paths:
    - .github/workflows/release.yml
    - Cargo.toml
    - Cargo.lock
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and upload artifacts without publishing a release
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  version:
    name: Tag matches Cargo.toml version
    runs-on: ${{ vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Compare tag and package version
      if: startsWith(github.ref, 'refs/tags/v')
      shell: bash
      run: "tag=\"${GITHUB_REF_NAME#v}\"\nversion=\"$(sed -n 's/^version = \"\\(.*\\)\"$/\\1/p' Cargo.toml | head\
        \ -n 1)\"\nif [[ -z \"$version\" || \"$tag\" != \"$version\" ]]; then\n  echo \"::error::tag $GITHUB_REF_NAME\
        \ does not match Cargo.toml version $version\"\n  exit 1\nfi\necho \"tag $GITHUB_REF_NAME matches Cargo.toml\
        \ version $version\"\n"
    - name: Production tags must identify main
      if: startsWith(github.ref, 'refs/tags/v')
      shell: bash
      run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
  build:
    name: Build (${{ matrix.target }})
    needs:
    - version
    - release-checks
    runs-on: ${{ matrix.os == 'ubuntu-latest' && vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404'
      || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: x86_64-unknown-linux-musl
          os: ubuntu-latest
        - target: aarch64-unknown-linux-musl
          os: ubuntu-latest
        - target: x86_64-apple-darwin
          os: macos-latest
        - target: aarch64-apple-darwin
          os: macos-latest
        - target: x86_64-pc-windows-msvc
          os: windows-latest
        - target: aarch64-pc-windows-msvc
          os: windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      with:
        targets: ${{ matrix.target }}
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        key: ${{ matrix.target }}
    - name: Run tests (host)
      run: cargo test --locked --features fake
    - name: Install ziglang
      if: contains(matrix.target, 'linux-musl')
      run: python3 -m pip install --user --break-system-packages ziglang==0.16.0
    - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe
      if: contains(matrix.target, 'linux-musl')
      with:
        tool: cargo-zigbuild@0.23.4
    - name: Build release (zigbuild)
      if: contains(matrix.target, 'linux-musl')
      run: cargo zigbuild --release --locked --target ${{ matrix.target }}
    - name: Build release
      if: ${{ !contains(matrix.target, 'linux-musl') }}
      run: cargo build --release --locked --target ${{ matrix.target }}
    - name: Smoke test
      if: ${{ matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-apple-darwin' || matrix.target
        == 'x86_64-pc-windows-msvc' }}
      shell: bash
      run: 'bin="target/${{ matrix.target }}/release/opv"

        if [[ "${{ matrix.target }}" == *windows* ]]; then bin="$bin.exe"; fi

        "$bin" --version

        # The MCP server ships in the same binary (0.8.1): it must be there.

        "$bin" mcp serve --help >/dev/null

        '
    - name: Rename binary
      shell: bash
      run: "bin=\"target/${{ matrix.target }}/release/opv\"\nout=\"dist/opv-${{ matrix.target }}\"\nif [[ \"${{\
        \ matrix.target }}\" == *windows* ]]; then\n  bin=\"$bin.exe\"\n  out=\"$out.exe\"\nfi\nmkdir -p dist\n\
        cp \"$bin\" \"$out\"\n"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: opv-${{ matrix.target }}
        path: dist/opv-${{ matrix.target }}*
        if-no-files-found: error
    if: github.ref == 'refs/heads/staging'
  package:
    name: Package release assets
    needs: build
    runs-on: ${{ vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        merge-multiple: true
        path: dist
    - name: Create alias and checksums
      shell: bash
      run: 'cp dist/opv-x86_64-unknown-linux-musl dist/opv

        (cd dist && sha256sum opv* > ../SHA256SUMS) && mv SHA256SUMS dist/

        '
    - name: Build npm packages and smoke test
      shell: bash
      run: "version=\"$(sed -n 's/^version = \"\\(.*\\)\"$/\\1/p' Cargo.toml | head -n 1)\"\nnode scripts/npm/build.mjs\
        \ --version \"$version\" --assets dist --out npm-dist\nmkdir -p npm-smoke/node_modules/@matthew-cochran/opv\
        \ npm-smoke/node_modules/@matthew-cochran/opv-linux-x64\ncp -r npm-dist/opv/. npm-smoke/node_modules/@matthew-cochran/opv/\n\
        cp -r npm-dist/@matthew-cochran/opv-linux-x64/. npm-smoke/node_modules/@matthew-cochran/opv-linux-x64/\n\
        out=\"$(node npm-smoke/node_modules/@matthew-cochran/opv/bin/opv.js --version)\"\necho \"$out\"\ncase \"\
        $out\" in\n  'opv '*) ;;\n  *) echo \"::error::npm smoke test output did not start with 'opv ': $out\";\
        \ exit 1 ;;\nesac\n"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: release-assets
        path: dist/
        if-no-files-found: error
    - name: Retain complete immutable release candidate
      id: retain
      shell: bash
      run: "set -euo pipefail\nmkdir -p candidate/dist candidate/npm\ncp -R dist/. candidate/dist/\nfor pkg in ./npm-dist/@matthew-cochran/opv-*\
        \ ./npm-dist/opv; do\n  npm pack \"$pkg\" --ignore-scripts --pack-destination candidate/npm\ndone\nnode\
        \ scripts/release-assets.ts record candidate\n"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ${{ steps.retain.outputs.artifact }}
        path: candidate/
        if-no-files-found: error
        retention-days: 90
    if: github.ref == 'refs/heads/staging'
  publish:
    name: Publish release
    needs: resolve
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
    runs-on: ${{ vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: ${{ needs.resolve.outputs.artifact }}
        run-id: ${{ needs.resolve.outputs.run-id }}
        github-token: ${{ github.token }}
        path: candidate
    - name: Verify exact staged checksums and tree
      env:
        GH_TOKEN: ${{ github.token }}
      run: node scripts/release-assets.ts verify candidate
    - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
      with:
        subject-path: candidate/dist/opv*
    - name: Create GitHub release
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
      run: gh release create "$GITHUB_REF_NAME" candidate/dist/* --verify-tag --title "$GITHUB_REF_NAME"
  npm:
    name: Publish npm packages
    needs: resolve
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true && vars.NPM_PUBLISH == 'true'
    runs-on: ${{ vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: ${{ needs.resolve.outputs.artifact }}
        run-id: ${{ needs.resolve.outputs.run-id }}
        github-token: ${{ github.token }}
        path: candidate
    - name: Verify exact staged checksums and tree
      env:
        GH_TOKEN: ${{ github.token }}
      run: node scripts/release-assets.ts verify candidate
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 22
        registry-url: https://registry.npmjs.org
    - name: Use npm with trusted publishing support
      run: npm install -g npm@^11.5.1
    - name: Publish npm packages
      shell: bash
      run: "set -euo pipefail\nfor tarball in candidate/npm/*.tgz; do\n  npm publish \"$tarball\" --provenance --access\
        \ public\ndone\n"
  release-checks:
    if: github.ref == 'refs/heads/staging'
    uses: ./.github/workflows/ci.yml
    secrets: inherit
  resolve:
    name: Resolve staged release bytes
    needs: version
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    outputs:
      run-id: ${{ steps.resolve.outputs.run-id }}
      artifact: ${{ steps.resolve.outputs.artifact }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
    - id: resolve
      env:
        GH_TOKEN: ${{ github.token }}
      run: node scripts/release-assets.ts resolve "$RUNNER_TEMP/opv-candidate"
