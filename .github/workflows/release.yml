name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and upload artifacts without publishing a release
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}
      - name: Run tests (host)
        run: cargo test --features fake
      - name: Install ziglang
        if: contains(matrix.target, 'linux-musl')
        run: python3 -m pip install --user --break-system-packages ziglang==0.16.0
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        if: contains(matrix.target, 'linux-musl')
        with:
          tool: cargo-zigbuild@0.23.4
      - name: Build release (zigbuild)
        if: contains(matrix.target, 'linux-musl')
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}
      - name: Build release
        if: ${{ !contains(matrix.target, 'linux-musl') }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test
        if: ${{ matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-pc-windows-msvc' }}
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/secretctl"
          if [[ "${{ matrix.target }}" == *windows* ]]; then bin="$bin.exe"; fi
          "$bin" --version
      - name: Rename binary
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/secretctl"
          out="dist/secretctl-${{ matrix.target }}"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            bin="$bin.exe"
            out="$out.exe"
          fi
          mkdir -p dist
          cp "$bin" "$out"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: secretctl-${{ matrix.target }}
          path: dist/secretctl-${{ matrix.target }}*
          if-no-files-found: error

  package:
    name: Package release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          merge-multiple: true
          path: dist
      - name: Create alias and checksums
        shell: bash
        run: |
          cp dist/secretctl-x86_64-unknown-linux-musl dist/secretctl
          (cd dist && sha256sum secretctl* > ../SHA256SUMS) && mv SHA256SUMS dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: release-assets
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/secretctl*'
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME"
