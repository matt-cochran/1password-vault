name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and upload artifacts without publishing a release
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  version:
    name: Tag matches Cargo.toml version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare tag and package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [[ -z "$version" || "$tag" != "$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches Cargo.toml version $version"

  build:
    name: Build (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}
      - name: Run tests (host)
        run: cargo test --locked --features fake
      - name: Install ziglang
        if: contains(matrix.target, 'linux-musl')
        run: python3 -m pip install --user --break-system-packages ziglang==0.16.0
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        if: contains(matrix.target, 'linux-musl')
        with:
          tool: cargo-zigbuild@0.23.4
      - name: Build release (zigbuild)
        if: contains(matrix.target, 'linux-musl')
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}
      - name: Build release
        if: ${{ !contains(matrix.target, 'linux-musl') }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test
        if: ${{ matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-pc-windows-msvc' }}
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/opv"
          if [[ "${{ matrix.target }}" == *windows* ]]; then bin="$bin.exe"; fi
          "$bin" --version
      - name: Rename binary
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/opv"
          out="dist/opv-${{ matrix.target }}"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            bin="$bin.exe"
            out="$out.exe"
          fi
          mkdir -p dist
          cp "$bin" "$out"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opv-${{ matrix.target }}
          path: dist/opv-${{ matrix.target }}*
          if-no-files-found: error

  package:
    name: Package release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          merge-multiple: true
          path: dist
      - name: Create alias and checksums
        shell: bash
        run: |
          cp dist/opv-x86_64-unknown-linux-musl dist/opv
          (cd dist && sha256sum opv* > ../SHA256SUMS) && mv SHA256SUMS dist/
      - name: Build npm packages and smoke test
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          node scripts/npm/build.mjs --version "$version" --assets dist --out npm-dist
          mkdir -p npm-smoke/node_modules/opv npm-smoke/node_modules/@matthew-cochran/opv-linux-x64
          cp -r npm-dist/opv/. npm-smoke/node_modules/opv/
          cp -r npm-dist/@matthew-cochran/opv-linux-x64/. npm-smoke/node_modules/@matthew-cochran/opv-linux-x64/
          out="$(node npm-smoke/node_modules/opv/bin/opv.js --version)"
          echo "$out"
          case "$out" in
            'opv '*) ;;
            *) echo "::error::npm smoke test output did not start with 'opv ': $out"; exit 1 ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: release-assets
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/opv*'
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME"

  npm:
    name: Publish npm packages
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: release-assets
          path: dist
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Check for NPM_TOKEN
        id: token
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "$NPM_TOKEN" ]]; then
            echo "::notice::NPM_TOKEN is not set; skipping npm publish"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build npm packages
        if: steps.token.outputs.present == 'true'
        run: node scripts/npm/build.mjs --version "${GITHUB_REF_NAME#v}" --assets dist --out npm-dist
      - name: Publish platform packages
        if: steps.token.outputs.present == 'true'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in npm-dist/@matthew-cochran/opv-*; do
            npm publish "$pkg" --provenance --access public
          done
      - name: Publish opv
        if: steps.token.outputs.present == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish npm-dist/opv --provenance --access public
