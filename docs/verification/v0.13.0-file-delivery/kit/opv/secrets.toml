# opv manifest for the #136 live checks (A4). CANARY VALUES ONLY.
#
# Copy it into the session's scratch project ($S/project/secrets.toml, preflight P7).
# `opv propose structure` + `opv apply` (a person) create the boundary items and the state
# vaults and write the ids into secrets.bindings.toml beside it. Nothing here names a real
# Journeeze item or the fleet's own state vault, so no real value can be read or written.
#
# Environments:
#   verify, verify-nofsgroup  a local, throwaway kind cluster (§12.1; no staging cluster exists)
#   verify-fly                the LIVE staging fleet app, under a canary-only name template.
#                             Synced WITHOUT --deploy, ever: names are staged, never deployed.
#   dev                       local tier, for opv run (A4-V15)
#
# The Fly template OPVCANARY__{PRODUCT}__{KEY} is this target's managed set; the fleet's own
# FLEET__* names are "unmanaged on Fly (never touched)" for it (docs/usage.md:189,255).

[environments.verify]
account = "6AINMAIK25AXBKGVDTLIALKZRY"   # the account id of journeeze-saas/.opv (an id, not a secret)
boundaries.journeeze = {}

[environments.verify.targets.kind]
kubernetes.context = "opv-ci"
kubernetes.namespace = "jzverify"
kubernetes.deployment = "jzverify"
kubernetes.env_name = "{KEY}"                # LOG_LEVEL reaches the consumer under its own name
kubernetes.container = "journeeze"
kubernetes.config = "configmap"
kubernetes.secrets_dir = "/run/secrets/{product}"
roles = ["serve"]

[environments.verify-nofsgroup]
account = "6AINMAIK25AXBKGVDTLIALKZRY"
boundaries.journeeze = {}

[environments.verify-nofsgroup.targets.kind]
kubernetes.context = "opv-ci"
kubernetes.namespace = "jzverify"
kubernetes.deployment = "jzverify-nofsgroup"
kubernetes.env_name = "{KEY}"
kubernetes.container = "journeeze"
kubernetes.config = "configmap"
kubernetes.secrets_dir = "/run/secrets/{product}"
roles = ["serve"]

[environments.verify-fly]
account = "6AINMAIK25AXBKGVDTLIALKZRY"
boundaries.journeeze = {}

[environments.verify-fly.targets.fleet]
fly.app = "mcproductlabs-portfolio-staging"   # P0: the owner confirms this is journeeze's staging app
fly.secret_name = "OPVCANARY__{PRODUCT}__{KEY}"
fly.config = "secrets"
roles = ["serve"]

[environments.dev]
account = "6AINMAIK25AXBKGVDTLIALKZRY"
tier = "local"
boundaries.journeeze = {}

[products.journeeze.local]
environment = "declared_only"
secrets_dir_env = "OPV_SECRETS_DIR"

# --- serve keys (§4.6) ---------------------------------------------------------------
# Multi-line or trailing-newline values: not on the Fly leg (a Fly variable can't hold
# them verbatim, §4.5 change 4).
[products.journeeze.keys.DATABASE_URL]
kind = "secret"
environments = ["verify", "verify-nofsgroup", "dev"]
roles = ["serve"]
file = "database/url"
guidance = "CANARY ONLY: from gen-canary.py values/multiline/DATABASE_URL"

[products.journeeze.keys.GITHUB_APP_PRIVATE_KEY]
kind = "secret"
environments = ["verify", "verify-nofsgroup", "dev"]
roles = ["serve"]
file = "github-app/private-key"
guidance = "CANARY ONLY: from gen-canary.py values/multiline/GITHUB_APP_PRIVATE_KEY"

[products.journeeze.keys.GITHUB_WEBHOOK_SECRET]
kind = "secret"
environments = ["verify", "verify-nofsgroup", "verify-fly", "dev"]
roles = ["serve"]
file = "github/webhook-secret"
guidance = "CANARY ONLY: from gen-canary.py values/*.env"

[products.journeeze.keys.TYPESAFE_JEV_API_KEY]
kind = "secret"
environments = ["verify", "verify-nofsgroup", "verify-fly", "dev"]
roles = ["serve"]
file = "jev/api-key"
guidance = "CANARY ONLY: from gen-canary.py values/*.env"

[products.journeeze.keys.BLOB_ACCESS_KEY_ID]
kind = "secret"
environments = ["verify", "verify-nofsgroup", "verify-fly", "dev"]
roles = ["serve"]
file = "blob/access-key-id"
guidance = "CANARY ONLY: from gen-canary.py values/*.env"

[products.journeeze.keys.BLOB_SECRET_ACCESS_KEY]
kind = "secret"
environments = ["verify", "verify-nofsgroup", "verify-fly", "dev"]
roles = ["serve"]
file = "blob/secret-access-key"
guidance = "CANARY ONLY: from gen-canary.py values/*.env"

[products.journeeze.keys.GUIDE_ASSET_SIGNING_KEY]
kind = "secret"
environments = ["verify", "verify-nofsgroup", "verify-fly", "dev"]
roles = ["serve"]
file = "guide-assets/signing-key"
guidance = "CANARY ONLY: from gen-canary.py values/*.env"

[products.journeeze.keys.OTEL_EXPORTER_OTLP_ENDPOINT]
kind = "secret"
environments = ["verify", "verify-nofsgroup", "verify-fly", "dev"]
roles = ["serve"]
file = "otel/endpoint"
guidance = "CANARY ONLY: from gen-canary.py values/*.env"

[products.journeeze.keys.OTEL_EXPORTER_OTLP_HEADERS]
kind = "secret"
environments = ["verify", "verify-nofsgroup", "verify-fly", "dev"]
roles = ["serve"]
file = "otel/headers"
guidance = "CANARY ONLY: from gen-canary.py values/*.env"

# --- migrate keys: never in the serve mount, never on the serve-only targets -----------
[products.journeeze.keys.DATABASE_URL_UNPOOLED]
kind = "secret"
environments = ["verify", "verify-nofsgroup", "dev"]
roles = ["migrate"]
file = "database/owner-url"
guidance = "CANARY ONLY: from gen-canary.py values/multiline/DATABASE_URL_UNPOOLED"

[products.journeeze.keys.JOURNEEZE_APP_PASSWORD]
kind = "secret"
environments = ["verify", "verify-nofsgroup", "dev"]
roles = ["migrate"]
file = "database/app-password"
guidance = "CANARY ONLY: from gen-canary.py values/*.env"

# --- config ---------------------------------------------------------------------------
[products.journeeze.keys.LOG_LEVEL]
kind = "config"
environments = ["verify", "verify-nofsgroup", "verify-fly", "dev"]
roles = ["serve", "migrate"]
guidance = "CANARY ONLY: from gen-canary.py values/*.env"
