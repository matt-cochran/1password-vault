# A team: shared development values, each developer's own LLM keys, and production
# visible only to the devops group. Commit this file; it holds no value.
#
# opv bootstrap creates each environment's boundary item and each target's state vault and
# fills in the IDs below; commit the result.

# Local development. Team values in the team's dev boundary (shared with the developers'
# group); each developer's own keys in their own Private/Employee vault, so they need no
# boundary.
[environments.dev]
boundaries.api = { vault_id = "", item_id = "" }
title = "Local development"
order = 1

[environments.staging]
boundaries.api = { vault_id = "", item_id = "" }
title = "Staging"
order = 2

[environments.staging.targets.app]
fly.app = "acme-staging"
fly.secret_name = "ACME__{PRODUCT}__{KEY}"
state_vault_id = ""

# Shared in 1Password only with the devops group: developers see it listed, dimmed,
# "not available to you (audience: devops)", never as an error.
[environments.prod]
boundaries.api = { vault_id = "", item_id = "" }
title = "Production"
order = 3
audience = "devops"
confirm_env = true

[environments.prod.targets.app]
fly.app = "acme-prod"
fly.secret_name = "ACME__{PRODUCT}__{KEY}"
state_vault_id = ""

# Each developer's own OpenAI key, used by every product they run locally and billed to
# them. One value per person, in their own item, so this product needs no boundary.
[products.shared]
source_only = true

[products.shared.keys.OPENAI_API_KEY]
kind = "secret"
environments = ["dev"]
personal = true
guidance = "platform.openai.com / API keys: create your own key (billed to you)"

[products.api]
boundary = "api"

[products.api.keys.OPENAI_API_KEY]
kind = "secret"
from = "shared/OPENAI_API_KEY"
environments = ["dev"]
personal = true

[products.worker]

[products.worker.keys.OPENAI_API_KEY]
kind = "secret"
from = "shared/OPENAI_API_KEY"
environments = ["dev"]
personal = true

# Team values, the same for everyone in an environment.
[products.api.keys.DATABASE_URL]
kind = "secret"
environments = ["dev", "staging", "prod"]
rules = { prefix = "postgres://" }

# Deployed environments use the service's own key, never a person's.
[products.api.keys.SERVICE_OPENAI_API_KEY]
kind = "secret"
environments = ["staging", "prod"]
guidance = "the service account's OpenAI key"
