# One product on a shared Fly app and on a dedicated overflow app, from one 1Password
# project. Each product's values live in its own vault (its access boundary), entered once. opv bootstrap
# creates each boundary item and each target's state vault and records the IDs in
# secrets.bindings.toml beside this file; commit both. Neither file holds a value.

# Local runs: the overflow product's own key, on this machine. No target.
[environments.dev]
# p's values vault in dev; recorded by opv bootstrap.
boundaries.p = {}

# Production: two named Fly targets that read the same boundary items.
[environments.prod]
# One values vault per product, plus the shared one; recorded by opv bootstrap. The
# overflow app's deploy identity reads only p's vault: it never sees web's or api's values.
boundaries.shared = {}
boundaries.web = {}
boundaries.api = {}
boundaries.p = {}

# The shared app: it delivers every product with a key in prod (web, api and p).
[environments.prod.targets.shared]
fly.app = "portfolio-prod"
fly.secret_name = "FLEET__{PRODUCT}__{KEY}"
deploy_credentials = "op://infra-prod/fly-deploy-shared"

# The overflow app: it delivers only p, under its bare key names.
[environments.prod.targets.p-overflow]
fly.app = "p-overflow-prod"
fly.secret_name = "{KEY}"
products = ["p"]
deploy_credentials = "op://infra-prod/fly-deploy-p-overflow"

# One value two products read with `from`; never delivered by itself.
[products.shared]
source_only = true

# The one shared value: web and api each read it, so it is entered once.
[products.shared.keys.DATABASE_URL]
kind = "secret"
environments = ["prod"]
rules = { prefix = "postgres://" }
guidance = "Neon / Connection string (one database for the project)"

# The web product, deployed on the shared app.
[products.web]

# web's key with the same value as shared/DATABASE_URL.
[products.web.keys.DATABASE_URL]
kind = "secret"
from = "shared/DATABASE_URL"
environments = ["prod"]

# web's own session key.
[products.web.keys.SESSION_SECRET]
kind = "secret"
environments = ["prod"]
rules = { base64_bytes = 32 }
guidance = "openssl rand -base64 32"

# The api product, deployed on the shared app.
[products.api]

# api's key with the same value as shared/DATABASE_URL.
[products.api.keys.DATABASE_URL]
kind = "secret"
from = "shared/DATABASE_URL"
environments = ["prod"]

# api's own Stripe key.
[products.api.keys.STRIPE_SECRET_KEY]
kind = "secret"
environments = ["prod"]
rules = { prefix = "sk_" }
guidance = "Stripe Dashboard / Developers / API keys"

# The overflow product: it runs in dev and deploys to both prod apps.
[products.p]

# p's key, used locally and on both prod apps.
[products.p.keys.OPENAI_API_KEY]
kind = "secret"
environments = ["dev", "prod"]
guidance = "platform.openai.com / API keys"
