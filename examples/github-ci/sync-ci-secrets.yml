# .github/workflows/sync-ci-secrets.yml in an operations repository (not in the product
# repositories it writes to). Run it by hand after changing a value in 1Password, or on a
# schedule to repair drift.
name: Sync CI secrets from 1Password
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"   # Mondays 05:17 UTC

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [ci-api, ci-web]
    env:
      # Read-only service account for the "ci" vault. The GitHub token opv writes with is
      # NOT a secret of this workflow: opv reads it from the deploy_credentials item.
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      OPV_VERSION: v0.6.0   # the first release with the github target; pin what you tested
    steps:
      - uses: actions/checkout@v4
      - name: Install the 1Password CLI
        uses: 1password/install-cli-action@v1
      - name: Install opv
        run: |
          base=https://github.com/matt-cochran/1password-vault/releases/download/$OPV_VERSION
          curl -fsSLO "$base/opv-x86_64-unknown-linux-musl"
          curl -fsSLO "$base/SHA256SUMS"
          sha256sum -c SHA256SUMS --ignore-missing
          install -m 0755 opv-x86_64-unknown-linux-musl /usr/local/bin/opv
      # gh is preinstalled on GitHub-hosted runners.
      - name: Plan (names only)
        run: opv plan ${{ matrix.env }}
      - name: Sync
        run: opv sync ${{ matrix.env }} --prune
