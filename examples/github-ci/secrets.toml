# CI secrets for two product repositories, managed from 1Password with opv.
# One boundary item per environment holds every value; `shared` holds the values several
# repositories use, once.
#
#   opv plan ci-api            # what would change in my-org/api, names only
#   opv sync ci-api            # set the secrets and variables (live at once)
#   opv sync ci-web --prune    # also delete names opv manages that are no longer declared

# Both environments read the same item (vault "ci", item "ci values"): replace the IDs
# with yours (`opv init` writes them for you). Each target's state vault is recorded by
# `opv init`/`opv bootstrap` into state_vault_id.
[environments.ci-api]
boundaries.core = { vault_id = "vci1234example", item_id = "ici1234example" }

[environments.ci-api.targets.app]
github.repo = "my-org/api"
products = ["api"]
deploy_credentials = "op://ci/github-secrets-writer"   # fine-grained token, field GH_TOKEN
state_vault_id = ""

[environments.ci-web]
boundaries.core = { vault_id = "vci1234example", item_id = "ici1234example" }

[environments.ci-web.targets.app]
github.repo        = "my-org/web"
github.environment = "production"     # the GitHub environment must exist (Settings → Environments)
products           = ["web"]
deploy_credentials = "op://ci/github-secrets-writer"
state_vault_id     = ""

# One home for values both repositories use: never delivered by itself.
[products.shared]
source_only = true
boundary = "core"

[products.shared.keys.FLY_API_TOKEN]
kind = "secret"
environments = ["ci-api", "ci-web"]
guidance = "fly tokens create org --name ci (Fly org deploy token)"

[products.shared.keys.CLOUDFLARE_ACCOUNT_ID]
kind = "config"
environments = ["ci-api", "ci-web"]
guidance = "Cloudflare dashboard / Account ID"

# api: workflows read secrets.FLY_API_TOKEN, secrets.NPM_TOKEN and vars.CLOUDFLARE_ACCOUNT_ID.
[products.api]
boundary = "core"

[products.api.keys.FLY_API_TOKEN]
kind = "secret"
from = "shared/FLY_API_TOKEN"
environments = ["ci-api"]

[products.api.keys.NPM_TOKEN]
kind = "secret"
environments = ["ci-api"]
rules = { prefix = "npm_" }
guidance = "npmjs.com / Access Tokens / Granular, publish to @my-org"

[products.api.keys.CLOUDFLARE_ACCOUNT_ID]
kind = "config"
from = "shared/CLOUDFLARE_ACCOUNT_ID"
environments = ["ci-api"]

# web: the same Fly token, its own E2E credentials.
[products.web]
boundary = "core"

[products.web.keys.FLY_API_TOKEN]
kind = "secret"
from = "shared/FLY_API_TOKEN"
environments = ["ci-web"]

[products.web.keys.E2E_ADMIN_TOKEN]
kind = "secret"
environments = ["ci-web"]
guidance = "staging admin console / API tokens (e2e user)"

[products.web.keys.SHARED_STAGING_APP]
kind = "config"
environments = ["ci-web"]
guidance = "Fly app name of the shared staging app"
