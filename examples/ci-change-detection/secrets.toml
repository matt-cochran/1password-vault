# CI change detection: keep a Fly app in step with its 1Password source item.
#
# A read-only *reader* service account runs `opv changed`, `opv plan` and the nightly
# drift check. A *deployer* service account, held in a GitHub environment secret with
# required reviewers, runs `opv sync`. See README.md. The 1Password IDs live beside this
# file in secrets.bindings.toml: replace the placeholder IDs there with yours (`opv init`
# writes them for you).

[environments.staging]
boundaries.core = {}

[environments.staging.targets.app]
fly.app = "my-app-staging"
fly.secret_name = "APP__{PRODUCT}__{KEY}"

# confirm_env = true: the change workflow plans prod and syncs it with --expect-plan
# only after the plan id in the job summary has been reviewed.
[environments.prod]
boundaries.core = {}
confirm_env = true

[environments.prod.targets.app]
fly.app = "my-app-prod"
fly.secret_name = "APP__{PRODUCT}__{KEY}"

[products.app]
boundary = "core"

[products.app.keys.DATABASE_URL]
kind = "secret"
environments = ["staging", "prod"]
guidance = "Neon / connection string (one database per environment)"

[products.app.keys.API_TOKEN]
kind = "secret"
environments = ["staging", "prod"]
guidance = "the API's bearer token"
