# A two-product fleet on Fly, declared before anything exists in 1Password.
# opv bootstrap creates each environment's boundary vault and item and each target's state
# vault, then records their IDs in secrets.bindings.toml beside this file; commit both.

# One boundary holds every value in the environment, so the two products share it.
[environments.dev]
boundaries.core = {}

[environments.staging]
boundaries.core = {}

[environments.staging.targets.app]
fly.app = "my-fleet-staging"
fly.secret_name = "FLEET__{PRODUCT}__{KEY}"

[environments.prod]
boundaries.core = {}
confirm_env = true          # sync prod needs --confirm prod (or a reviewed --expect-plan id)

[environments.prod.targets.app]
fly.app = "my-fleet-prod"
fly.secret_name = "FLEET__{PRODUCT}__{KEY}"

# One home for values several products use.
[products.shared]
source_only = true
boundary = "core"

[products.shared.keys.DATABASE_URL]
kind = "secret"
environments = ["dev", "staging", "prod"]
rules = { prefix = "postgres://" }
guidance = "Neon / Connection string (one database per environment)"

[products.api]
boundary = "core"

[products.api.keys.DATABASE_URL]
kind = "secret"
from = "shared/DATABASE_URL"
environments = ["dev", "staging", "prod"]

[products.api.keys.STRIPE_SECRET_KEY]
kind = "secret"
environments = ["staging", "prod"]
rules = { prefix = "sk_" }
guidance = "Stripe Dashboard / Developers / API keys (test key in staging)"

[products.api.keys.JWT_SIGNING_KEY]
kind = "secret"
environments = ["dev", "staging", "prod"]
immutable = true
rules = { base64_bytes = 32 }
guidance = "openssl rand -base64 32 (never change it once users have tokens)"

[products.worker]
boundary = "core"

[products.worker.keys.DATABASE_URL]
kind = "secret"
from = "shared/DATABASE_URL"
environments = ["staging", "prod"]

[products.worker.keys.LOG_LEVEL]
kind = "config"
environments = ["dev", "staging", "prod"]
rules = { enum = ["debug", "info", "warn"] }
