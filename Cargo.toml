[package]
name = "opv"
default-run = "opv"
version = "0.19.0"
edition = "2024"
# Pinned with rust-toolchain.toml; the minimum supported Rust is that toolchain.
rust-version = "1.99.1"
license = "MIT"
description = "Sync secrets from 1Password into runtime targets such as Fly.io without ever printing, logging or writing a value"
repository = "https://github.com/matt-cochran/1password-vault"
homepage = "https://opv.dev"
readme = "README.md"
keywords = ["1password", "secrets", "secrets-management", "fly", "devops"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["spike/", ".delivery/", ".github/", "packaging/", "docs/assets/"]

[features]
default = ["ui", "mcp"]
mcp = ["dep:rmcp", "dep:tokio"]
# Exposes `runner::fake::FakeRunner` to integration tests and downstream test code.
fake = []
# `opv ui`, the terminal user interface (#82). On by default; `--no-default-features`
# builds the CLI without it.
ui = ["dep:ratatui", "dep:crossterm"]

[dependencies]
rmcp = { version = "3.9.0", optional = true, default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "sync"] }
clap = { version = "4.6", features = ["derive", "env", "string"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1"
# Edits secrets.toml in place for `add` and `init --add-env`, keeping comments and order.
toml_edit = "0.25"
secrecy = "0.10"
zeroize = "1"
thiserror = "2"
base64 = "0.23"
# GitHub API-secret sealed boxes preserve UTF-8 file bytes; gh stdin trims CR/LF.
crypto_box = { version = "=0.9.1", features = ["seal"] }
hex = "0.4"
regex = "1"
sha2 = "0.11"
# An application's own secret store over HTTPS (design http-target §5): ureq 3 over rustls
# with the operating system's trust store (rustls-platform-verifier), never bundled roots
# (`webpki-roots` must not enter the tree); the pinned descriptor is read through
# prost-reflect.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "_ring", "platform-verifier"] }
prost = "0.14"
prost-reflect = "0.16"
subtle = "2"
# Random Kubernetes Secret version ids (FR-38, SR-1); already in the tree via tempfile.
getrandom = "0.4"
rpassword = "7.5"
clap_complete = "4.6"
# The sealed target (design sealed-target §6, D2, #271): age for encryption to X25519
# recipients only (no `ssh`, `plugin`, `async` or `cli-common`; `armor` for the bundle's
# ASCII block), and SSHSIG ed25519 signing and verification in process (`ssh-key`, no
# default features: no ECDSA/RSA/DSA, no key encryption; 1Password returns the key
# unencrypted). `deny.toml` fences the p256 that age and hpke always bring.
age = { version = "0.12.1", default-features = false, features = ["armor"] }
ssh-key = { version = "0.6.7", default-features = false, features = ["ed25519", "alloc", "std"] }
ratatui = { version = "0.30", optional = true, default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", optional = true }

[target.'cfg(unix)'.dependencies]
# SIGINT/SIGTERM/SIGHUP/SIGQUIT forwarding to the running CLI (NR-12); libc is already in
# the tree.
signal-hook = "0.4"
libc = "0.2"
# Azure deploy credentials (FR-40, SR-4): statfs (RAM-backed check), file owner and the
# liveness of the run that left a stale directory. Already in the tree via tempfile.
rustix = { version = "1.1", default-features = false, features = ["fs", "process", "std"] }

[target.'cfg(windows)'.dependencies]
# Azure value hand-off and private az directory on native Windows (FR-40, SR-3, SR-4): a
# user-only named pipe and ACL. Already in the tree (rustix, errno).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ErrorReporting",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"

# The test-only simulator for `op`, `flyctl`, `kubectl`, `gh` and `ssh` (design §13). It needs
# the `fake` feature, which release builds never enable, so it never ships. Its root is not
# `main.rs`, so Cargo does not also take `tests/sim/` for an integration test.
[[bin]]
name = "opv-sim"
path = "tests/sim/opv_sim.rs"
required-features = ["fake"]
test = false
doctest = false

# The fault matrix over the real binary (design §13.3): tests/e2e/matrix.rs.
[[test]]
name = "e2e_matrix"
path = "tests/e2e/matrix.rs"
required-features = ["fake"]

# Disposable localhost HTTPS integration harness, excluded from release builds.
[[bin]]
name = "opv-github-api-fixture"
path = "tests/github-api/probe.rs"
required-features = ["fake"]
test = false
doctest = false
