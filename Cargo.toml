[package]
name = "opv"
version = "0.4.0"
edition = "2024"
# let-chains (`if let ... && let ...`) are stable from 1.88.
rust-version = "1.88"
license = "MIT"
description = "Sync secrets from 1Password into runtime targets such as Fly.io without ever printing, logging or writing a value"
repository = "https://github.com/matt-cochran/1password-vault"
homepage = "https://github.com/matt-cochran/1password-vault"
readme = "README.md"
keywords = ["1password", "secrets", "secrets-management", "fly", "devops"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["spike/", ".delivery/", ".github/", "packaging/", "docs/assets/"]

[features]
# Exposes `runner::fake::FakeRunner` to integration tests and downstream test code.
fake = []

[dependencies]
clap = { version = "4.6", features = ["derive", "env", "string"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
# Edits secrets.toml in place for `add` and `init --add-env`, keeping comments and order.
toml_edit = "0.25"
secrecy = "0.10"
zeroize = "1"
thiserror = "2"
base64 = "0.23"
hex = "0.4"
regex = "1"
sha2 = "0.10"
subtle = "2"
# Random Kubernetes Secret version ids (FR-38, SR-1); already in the tree via tempfile.
getrandom = "0.4"
rpassword = "7.5"
clap_complete = "4.6"

[target.'cfg(unix)'.dependencies]
# SIGINT/SIGTERM forwarding to the running CLI (NR-12); libc is already in the tree.
signal-hook = "0.3"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
