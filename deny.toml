# Check the dependency graph of the platforms opv ships (the six release targets) and builds
# on (Linux gnu for development and CI). A crate pulled in only for other platforms, such as
# webpki-root-certs under rustls-platform-verifier on Android, never enters an opv binary.
[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]

# cargo-deny configuration (v2 schema).
# https://embarkstudios.github.io/cargo-deny/

[licenses]
# Licenses used by the dependency tree that are approved for this crate.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "BSD-3-Clause",
    "ISC",
    # foldhash (through hashbrown, used by ratatui for `opv ui`): permissive, MIT-compatible.
    "Zlib",
]

[bans]
multiple-versions = "warn"

[sources]
# Only crates from the configured registry are permitted.
unknown-registry = "deny"
unknown-git = "deny"
