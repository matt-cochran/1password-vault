# cargo-deny configuration (v2 schema).
# https://embarkstudios.github.io/cargo-deny/

[licenses]
# Licenses used by the dependency tree that are approved for this crate.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "BSD-3-Clause",
    "ISC",
]

[bans]
multiple-versions = "warn"

[sources]
# Only crates from the configured registry are permitted.
unknown-registry = "deny"
unknown-git = "deny"
